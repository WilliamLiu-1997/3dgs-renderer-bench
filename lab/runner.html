import { PACKAGES, exactVersion } from './config.js';
const version = new URLSearchParams(location.search).get('three');
if (!exactVersion(version)) throw Error('Invalid Three.js version');
const base = version === PACKAGES.three.version ? './vendor/three/' : `https://cdn.jsdelivr.net/npm/three@${version}/`;
const map = document.createElement('script'); map.type = 'importmap';
map.textContent = JSON.stringify({ imports: { three: base + 'build/three.module.js', 'three/webgpu': base + 'build/three.webgpu.js', 'three/tsl': base + 'build/three.tsl.js', 'three/addons/': base + 'examples/jsm/' } });
document.head.append(map);
try { await import('./assets/runner.js'); } catch (error) { parent.postMessage({type:'fatal',error:String(error)}, location.origin); }
</script></body></html>
